<head>
	<!-- Meta -->
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
	<meta name="generator" content="Jekyll">

	<title>{%if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

	<!-- CSS & fonts -->
	<link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl | replace: '//', '/' }}">
	<link href='https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,700,900,400italic%7CSignika:700,300,400,600' rel='stylesheet' type='text/css'>

	<!-- RSS -->
	<link href="/atom.xml" type="application/atom+xml" rel="alternate" title="ATOM Feed" />

	<!-- https://purecss.io/start/ For forms styling -->
	<link rel="stylesheet" href="https://unpkg.com/purecss@0.6.2/build/pure-min.css" integrity="sha384-UQiGfs9ICog+LwheBSRCt1o5cbyKIHbwjWscjemyBMT9YCUMZffs6UqUTd0hObXD" crossorigin="anonymous">

	<link href="//maxcdn.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css" rel="stylesheet">

	<meta property="og:title" content="{{ page.title | default: site.title | escape }}" />
	<meta name="author" content="Moshe Weitzman" />
	<meta property="og:locale" content="en_US" />
<!--	<link rel="canonical" href="http://weitzman.github.io/blog" />-->
<!--	<meta property="og:url" content="http://weitzman.github.io/blog" />-->
	<meta property="og:site_name" content="Moshe Weitzman’s Blog" />
{% if page.image %}
	{% if page.image contains '://' %}{% assign og_image = page.image %}{% else %}{% assign og_image = site.url | replace: 'http://', 'https://' | append: page.image %}{% endif %}
	<meta property="og:image" content="{{ og_image }}" />
	<meta name="twitter:image" content="{{ og_image }}" />
	<meta name="twitter:card" content="summary_large_image" />
{% else %}
	<meta name="twitter:card" content="summary" />
{% endif %}
	<meta property="twitter:title" content="{{ page.title | default: site.title | escape }}" />
	<meta name="twitter:site" content="@weitzman" />
	<meta name="twitter:creator" content="@Moshe Weitzman" />
	<meta name="google-site-verification" content="1dCWhFtRvRx2RD6tDzW8uHQhQMHS_R9XKu7eou5gmwU" />

	<!--  seo tag was here -->

</head>
